version: '3.8'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quickbroker
      POSTGRES_USER: quickbroker
      POSTGRES_PASSWORD: ${DB_PASSWORD:-quickbroker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    restart: unless-stopped

  backend:
    build: ./server
    environment:
      DATABASE_URL: postgresql://quickbroker:${DB_PASSWORD:-quickbroker}@db:5432/quickbroker
      ZEPTOMAIL_TOKEN: ${ZEPTOMAIL_TOKEN:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-quickbroker-photos}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production}
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '3000:3000'
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - db
    restart: unless-stopped
    command: npm run dev

  frontend:
    build: ./web
    ports:
      - '5173:5173'
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - backend
    restart: unless-stopped
    command: npm run dev

volumes:
  pgdata:
